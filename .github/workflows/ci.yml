# Проверки на каждый push/PR; Storybook выкладывается на GitHub Pages только с main и только если всё зелёное.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # pnpm нужной версии — из поля packageManager (corepack)
      - run: corepack enable

      # prepare в @uix/tokens собирает dist (CSS токенов) при установке
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Истории Storybook — тесты в браузере (play-функции + axe во всех стилистиках и схемах)
      - run: pnpm --filter @uix/ui exec playwright install --with-deps chromium
      - run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ui/storybook-static

  deploy:
    name: Deploy Storybook to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
